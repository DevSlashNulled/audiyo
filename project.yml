name: Audiyo
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Audiyo:
    type: application
    platform: macOS
    sources:
      - Sources/Audiyo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.audiyo.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Audiyo
        INFOPLIST_KEY_CFBundleName: Audiyo
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Eli"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AudiyoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AudiyoTests
    dependencies:
      - target: Audiyo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.audiyo.app.tests
        GENERATE_INFOPLIST_FILE: YES
